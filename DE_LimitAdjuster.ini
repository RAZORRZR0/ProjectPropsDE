; DE_LimitAdjuster settings for Project Props DE.
; Put this file in the SAME folder as DE_LimitAdjuster.asi (e.g. Gameface\Binaries\Win64\ or Win64\scripts\).
; If DE_LimitAdjuster.log says "ini not found", the file is in the wrong folder and the game will crash with the props.
;
; [Pools]: 0 = keep DE's size. Values below were measured with all 16,166 Project Props placements
; (load + driving around); DE's own size is in brackets.
[Pools]
PtrNodeSingle = 100000  ; DE 75000
PtrNodeDouble = 20000   ; DE 7500  - ~13500 used at load: crash on load without this
EntryInfoNode = 4000    ; DE 600   - filled while driving past knock-over props
Peds = 0
Vehicles = 0
Buildings = 24000       ; DE 14000 - ~10000 used
Objects = 0
Dummys = 20000          ; DE 8500  - ~10200 used at load
ColModel = 12000        ; DE 10400 - ~10000 used
Task = 0
Event = 0
PointRoute = 0
PatrolRoute = 0
NodeRoute = 0
TaskAllocator = 0
PedIntelligence = 0     ; raised to Peds automatically
PedAttractors = 0
VehicleStructs = 0
MatrixList = 8000       ; DE 1800  - 1,066 tilted props keep one each for good

[Debug]
SampleMs = 1000     ; pool usage check every second (0 = off). Keep on: the log then says which pool ran out
LogInterval = 60    ; seconds between "usage:" lines in DE_LimitAdjuster.log
WarnPercent = 90    ; log a WARN line once a pool reaches this fill level
